<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuixxDados</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- LOBBY PRINCIPAL -->
    <div id="lobbyModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Quixx</h2>
            <p>Multijugador</p>

            <div id="sessionBanner" class="session-banner" style="display: none;">
                <p id="sessionBannerText" class="session-banner-text"></p>
            </div>

            <div id="urlDataDisplay" class="url-data-display" style="display: none; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--color-blue);">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span>Nombre: <span id="urlPlayerName">---</span></span>
                    <span>Sala: <span id="urlRoomCode">---</span></span>
                </div>
            </div>

            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-primary" onclick="entrarSala()">Entrar</button>
                    <button id="reconnectBtn" class="modal-btn btn-primary" onclick="reconnectToSession()" disabled>Reconectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UNIRSE A SALA -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-box">
            <h2>Unirse a Sala</h2>
            <p>Pide el codigo al creador de la sala</p>
            <div class="input-group">
                <label>Codigo de la Sala (4 letras/numeros):</label>
                <input type="text" id="roomCodeInput" placeholder="ABCD" maxlength="4" style="text-transform: uppercase;">
            </div>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="backToLobby()">Volver</button>
                    <button class="modal-btn btn-secondary" onclick="joinRoom()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARGANDO -->
    <div id="loadingModal" class="modal-overlay">
        <div class="modal-box" style="background: transparent; border: none; box-shadow: none;">
            <h2 id="loadingText">Conectando...</h2>
        </div>
    </div>

    <!-- RECLAMO DE NOMBRE (RECONEXION DESDE OTRO DISPOSITIVO) -->
    <div id="claimModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Jugador existente</h3>
            <p id="claimText">Ya hay un jugador con este nombre en la sala.</p>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="declineClaim()">No, soy otro jugador</button>
                    <button class="modal-btn btn-primary" onclick="acceptClaim()">Si, soy yo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- REINICIAR -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="confirmTitle">Reiniciar tablero</h3>
            <p id="confirmText">Se borraran tus marcas actuales.</p>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button class="modal-btn btn-danger" onclick="confirmReset()">Reiniciar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UI DEL JUEGO -->
    <header>
        <h1>Quixx</h1>
        <div id="roomInfoDisplay" class="room-info" style="display: none;"></div>
    </header>

    <div class="app-container">
        <div class="board-container">
            <div class="board" id="game-board"></div>
        </div>

        <div class="side-panel">
            <div class="scoreboard">
                <div class="scores-grid">
                    <div class="score-item red"><span class="color-dot"></span><span id="score-red">0</span></div>
                    <div class="score-item yellow"><span class="color-dot"></span><span id="score-yellow">0</span></div>
                    <div class="score-item green"><span class="color-dot"></span><span id="score-green">0</span></div>
                    <div class="score-item blue"><span class="color-dot"></span><span id="score-blue">0</span></div>
                </div>
                
                <div class="penalties-section">
                    <span class="penalty-label">Fallas:</span>
                    <div id="penalty-0" class="penalty-box" onclick="handlePenaltyClick(0)"></div>
                    <div id="penalty-1" class="penalty-box" onclick="handlePenaltyClick(1)"></div>
                    <div id="penalty-2" class="penalty-box" onclick="handlePenaltyClick(2)"></div>
                    <div id="penalty-3" class="penalty-box" onclick="handlePenaltyClick(3)"></div>
                </div>

                <div class="total-score">
                    TOTAL: <span id="score-total">0</span>
                </div>
                
                <div class="controls">
                    <button id="resetBtn" class="modal-btn btn-danger" onclick="showModal()">Reiniciar Mi Tablero</button>
                </div>
            </div>

            <!-- Tabla de posiciones con mini tableros completos -->
            <div class="leaderboard" id="leaderboardPanel">
                <h3>Posiciones y Tableros</h3>
                <div id="playersList"></div>
            </div>
        </div>
    </div>

    <script src="js/juego.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="sesion.js"></script>
    <script src="mqtt.js"></script>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SagradaS</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- LOBBY PRINCIPAL - NO SE CIERRA AL HACER CLICK FUERA -->
    <div id="lobbyModal" class="modal-overlay no-close-on-outside">
        <div class="modal-box">
            <h2>SagradaS</h2>
            <p>Selecciona una cartilla para jugar</p>
            <div class="input-group">
                <label>Tu Nombre:</label>
                <input type="text" id="playerName" placeholder="Ej. Leo" maxlength="10">
            </div>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-primary" id="createRoomBtn">Crear Sala</button>
                    <button class="modal-btn btn-secondary" id="joinRoomBtn">Unirse</button>
                </div>
                <!-- ELIMINADO: botón Jugar Solo (Local) -->
            </div>
        </div>
    </div>

    <!-- UNIRSE A SALA - NO SE CIERRA AL HACER CLICK FUERA -->
    <div id="joinModal" class="modal-overlay no-close-on-outside">
        <div class="modal-box">
            <h2>Unirse a Sala</h2>
            <p>Pide el codigo al creador de la sala</p>
            <div class="input-group">
                <label>Codigo de la Sala (4 letras/numeros):</label>
                <input type="text" id="roomCodeInput" placeholder="ABCD" maxlength="4" style="text-transform: uppercase;">
            </div>
            <div class="modal-buttons row-btns">
                <button class="modal-btn btn-outline" id="backToLobbyBtn">Volver</button>
                <button class="modal-btn btn-secondary" id="enterRoomBtn">Entrar</button>
            </div>
        </div>
    </div>

    <!-- CARGANDO -->
    <div id="loadingModal" class="modal-overlay no-close-on-outside">
        <div class="modal-box" style="background: transparent; border: none; box-shadow: none;">
            <h2 id="loadingText">Conectando...</h2>
        </div>
    </div>

    <!-- SELECCIONAR CARTILLA INICIAL - 4 OPCIONES -->
    <div id="cardSelectorModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px; max-height: 80vh; overflow: hidden;">
            <h2>Selecciona tu Cartilla</h2>
            <p>Elige una de las 4 cartillas disponibles</p>
            <div id="cardSelectorGrid"></div>
        </div>
    </div>

    <!-- REINICIAR - SÍ SE CIERRA AL HACER CLICK FUERA -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-buttons">
                <button class="modal-btn btn-danger" id="confirmResetBtn">Reiniciar Todo</button>
            </div>
        </div>
    </div>


    <!-- UI DEL JUEGO -->
    <header>
        <h1>SagradaS</h1>
        <div style="display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4px;">
            <span id="roomInfoDisplay" class="room-info" style="display: none;"></span>
        </div>
    </header>

    <!-- INFORMACIÓN DEL JUEGO: OBJETIVOS Y HERRAMIENTAS -->
    <div id="gameInfo" style="display: none; width: 100%; max-width: 600px; margin-bottom: 10px;">
        <!-- Objetivos Públicos -->
        <div id="publicObjectives" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px;"></div>
        <!-- Herramientas -->
        <div id="toolsDisplay" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;"></div>
    </div>

    <div class="app-container">
        <div class="board-container">
            <div class="board" id="game-board"></div>
        </div>

        <div class="side-panel">
            <!-- Botonera - Ahora con Terminar entre Vitrinas y Reiniciar -->
            <div class="buttonera">
                <button class="modal-btn btn-primary" id="startGameBtn">Vitrinas</button>
                <button class="modal-btn btn-success" id="finishGameBtn" style="background: #2e7d32; color: white; border: none;">Terminar</button>
                <button class="modal-btn btn-danger" id="resetBtn">Reiniciar</button>
            </div>

            <!-- Tabla de posiciones con mini tableros -->
            <div class="leaderboard" id="leaderboardPanel">
                <h3>Leaderboard</h3>
                <div id="playersList"></div>
            </div>
        </div>
    </div>

        <!-- Scripts -->
        <script src="js/cartillas.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/deshacer.js"></script>
        <script src="js/objetivos.js"></script>
        <script src="js/herramientas.js"></script>
        <script src="js/juego.js"></script>
        <script src="js/puntaje.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/leaderboard.js"></script>
        <script src="js/zoom.js"></script> 
        <script src="js/marcador.js"></script>
        <script src="js/modales.js"></script>
        <script src="js/extra.js"></script>
        <script src="mqtt.js"></script>
        <script src="js/lobby.js"></script>
        <script src="main.js"></script>
</body>
</html>

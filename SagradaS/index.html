<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SagradaS</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- LOBBY PRINCIPAL -->
    <div id="lobbyModal" class="modal-overlay no-close-on-outside">
        <div class="modal-box">
            <h2>SagradaS</h2>
            <p>Multijugador</p>

            <div id="sessionBanner" class="session-banner" style="display: none;">
                <p id="sessionBannerText" class="session-banner-text"></p>
            </div>

            <div id="urlDataDisplay" class="url-data-display" style="display: none;">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span id="urlPlayerName">---</span>
                    <span id="urlRoomCode">---</span>
                </div>
            </div>

            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-primary" onclick="entrarSala()" style="flex: 1;">Entrar</button>
                    <button id="reconnectBtn" class="modal-btn btn-outline" onclick="reconnectToSession()" disabled style="flex: 1;">Reconectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARGANDO -->
    <div id="loadingModal" class="modal-overlay no-close-on-outside">
        <div class="modal-box" style="background: transparent; border: none; box-shadow: none;">
            <h2 id="loadingText">Conectando...</h2>
        </div>
    </div>

    <!-- RECLAMO DE NOMBRE (RECONEXION DESDE OTRO DISPOSITIVO) -->
    <div id="claimModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Jugador existente</h3>
            <p id="claimText">Ya hay un jugador con este nombre en la sala.</p>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="declineClaim()">No, soy otro jugador</button>
                    <button class="modal-btn btn-primary" onclick="acceptClaim()">Si, soy yo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SELECCIONAR CARTILLA INICIAL - 4 OPCIONES -->
    <div id="cardSelectorModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 600px; max-height: 80vh; overflow: hidden;">
            <h2>Selecciona tu Cartilla</h2>
            <p>Elige una de las 4 cartillas disponibles</p>
            <div id="cardSelectorGrid"></div>
        </div>
    </div>

    <!-- REINICIAR -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-buttons">
                <button class="modal-btn btn-danger" id="confirmResetBtn">Reiniciar Todo</button>
            </div>
        </div>
    </div>

    <!-- UI DEL JUEGO -->
    <header>
        <h1>SagradaS</h1>
        <div style="display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4px;">
            <span id="roomInfoDisplay" class="room-info" style="display: none;"></span>
        </div>
    </header>

    <!-- INFORMACION DEL JUEGO: OBJETIVOS Y HERRAMIENTAS -->
    <div id="gameInfo" style="display: none; width: 100%; max-width: 600px; margin-bottom: 10px;">
        <div id="publicObjectives" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px;"></div>
        <div id="toolsDisplay" style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;"></div>
    </div>

    <div class="app-container">
        <div class="board-container">
            <div class="board" id="game-board"></div>
        </div>

        <div class="side-panel">
            <div class="buttonera">
                <button class="modal-btn btn-primary" id="startGameBtn">Vitrinas</button>
                <button class="modal-btn btn-success" id="finishGameBtn" style="background: #2e7d32; color: white; border: none;">Terminar</button>
                <button class="modal-btn btn-danger" id="resetBtn">Reiniciar</button>
            </div>

            <div class="leaderboard" id="leaderboardPanel">
                <h3>Leaderboard</h3>
                <div id="playersList"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/cartillas.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/deshacer.js"></script>
    <script src="js/objetivos.js"></script>
    <script src="js/herramientas.js"></script>
    <script src="js/juego.js"></script>
    <script src="js/puntaje.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/zoom.js"></script> 
    <script src="js/marcador.js"></script>
    <script src="js/modales.js"></script>
    <script src="js/extra.js"></script>
    <script src="mqtt.js"></script>
    <script src="sesion.js"></script>
    <script src="main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Github Juegos</title>
    
    <!-- Favicon - Misma configuración que SagradaS -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="warehouse">
        <header id="filterHeader">
            <h1>Github Juegos</h1>
            <div id="syncIndicator" class="sync-indicator"></div>
        </header>

        <div id="filterDropdown" class="filter-dropdown">
            <div class="filter-dropdown-content">
                <div class="lobby-section">
                    <div class="lobby-section-title">Datos del Jugador</div>
                    <div class="lobby-fields">
                        <div class="lobby-field">
                            <label for="playerNameInput">Nombre</label>
                            <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="12">
                        </div>
                        <div class="lobby-field">
                            <label for="roomCodeInput">Codigo de Sala</label>
                            <input type="text" id="roomCodeInput" placeholder="GRIL" maxlength="6" style="text-transform: uppercase;">
                        </div>
                    </div>
                    <div class="lobby-actions">
                        <button id="saveLobbyDataBtn" class="lobby-btn btn-primary">Guardar datos</button>
                        <button id="clearLobbyDataBtn" class="lobby-btn btn-outline">Limpiar</button>
                    </div>
                    <div id="lobbyStatus" class="lobby-status" style="display: none;"></div>
                </div>

                <hr class="lobby-divider">

                <div class="lobby-section">
                    <div class="lobby-section-title">Filtrar por tema</div>
                    <div id="filterTopicsContainer" class="filter-topics-container"></div>
                </div>
            </div>
        </div>

        <div id="projectsContainer" class="shelves"></div>

        <footer>
            <p>GithubJuegos - Todos los juegos en un solo lugar</p>
            <button id="qrButton" class="qr-button">QR</button>
        </footer>
    </div>

    <div id="qrModal" class="qr-modal">
        <div class="qr-modal-content">
            <img src="qr-code.png" alt="Codigo QR" class="qr-image">
        </div>
    </div>

    <script src="animations.js"></script>
    <script src="config.js"></script>
    <script src="filtros.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>

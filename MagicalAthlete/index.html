<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MagicalAthlete</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- LOBBY PRINCIPAL -->
    <div id="lobbyModal" class="modal-overlay">
        <div class="modal-box">
            <h2>MagicalAthlete</h2>
            <p>Multijugador</p>

            <div id="sessionBanner" class="session-banner" style="display: none;">
                <p id="sessionBannerText" class="session-banner-text"></p>
            </div>

            <div id="urlDataDisplay" class="url-data-display" style="display: none; background: #2a2a4a; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--color-secondary);">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span id="urlPlayerName">---</span>
                    <span id="urlRoomCode">---</span>
                </div>
            </div>

            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-primary" onclick="entrarSala()" style="flex: 1;">Entrar</button>
                    <button id="reconnectBtn" class="modal-btn btn-outline" onclick="reconnectToSession()" disabled style="flex: 1;">Reconectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARGANDO -->
    <div id="loadingModal" class="modal-overlay">
        <div class="modal-box" style="background: transparent; border: none; box-shadow: none;">
            <h2 id="loadingText">Conectando...</h2>
        </div>
    </div>

    <!-- RECLAMO DE NOMBRE (RECONEXION DESDE OTRO DISPOSITIVO) -->
    <div id="claimModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Jugador existente</h3>
            <p id="claimText">Ya hay un jugador con este nombre en la sala.</p>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="declineClaim()">No, soy otro jugador</button>
                    <button class="modal-btn btn-primary" onclick="acceptClaim()">Si, soy yo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ZOOM -->
    <div id="zoomModal" class="modal-overlay" style="display: none;">
        <div class="modal-box zoom-box">
            <div id="zoomContent" class="zoom-content">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <!-- UI DEL JUEGO -->
    <header>
        <h1>MagicalAthlete</h1>
        <div id="roomInfoDisplay" class="room-info" style="display: none;"></div>
    </header>

    <div class="app-container">
        <div class="board-container">
            <div id="card-grid" class="card-grid"></div>
        </div>

        <div class="side-panel">
            <div class="game-controls">
                <div style="display: flex; gap: 10px; width: 100%;">
                    <button id="startGameBtn" class="modal-btn btn-primary" onclick="iniciarJuego()" style="flex: 1;">Corredores</button>
                    <button id="resetGameBtn" class="modal-btn btn-danger" onclick="resetGlobalGame()" style="flex: 1;">Reiniciar</button>
                </div>
                
                <!-- Area MIS CORREDORES -->
                <div class="my-cards-section">
                    <h4>Mis Corredores</h4>
                    <div id="my-cards-container" class="my-cards-container">
                        <!-- Se llena dinámicamente -->
                    </div>
                    
                    <!-- Puntaje del jugador -->
                    <div id="misPuntosDisplay" style="text-align:center; font-size:1.2rem; font-weight:bold; margin:8px 0;">Puntos: 0</div>
                    
                    <!-- Botones globales de puntuacion (siempre visibles) -->
                    <div id="puntaje-botones" class="puntaje-botones" style="margin-top: 10px;">
                        <button class="btn-puntaje btn-3" id="btnPuntaje3" onclick="asignarPuntoGlobal('+3')">+3</button>
                        <button class="btn-puntaje btn-2" id="btnPuntaje2" onclick="asignarPuntoGlobal('+2')">+2</button>
                        <button class="btn-puntaje btn-menos" id="btnPuntajeMenos" onclick="asignarPuntoGlobal('-1')">-1</button>
                        <button class="btn-puntaje btn-mas" id="btnPuntajeMas" onclick="asignarPuntoGlobal('+1')">+1</button>
                    </div>
                </div>
            </div>

            <!-- Tabla de posiciones con puntajes -->
            <div class="leaderboard" id="leaderboardPanel">
                <h3>Jugadores y puntajes</h3>
                <div id="playersList"></div>
            </div>
        </div>
    </div>

    <script src="js/juego.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/leaderboard.js"></script>
    <script src="js/zoom.js"></script>
    <script src="js/puntaje.js"></script>
    <script src="sesion.js"></script>
    <script src="mqtt.js"></script>
    <script src="main.js"></script>
</body>
</html>

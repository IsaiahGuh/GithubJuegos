<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CleverDados</title>
    
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.ico">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- LOBBY PRINCIPAL -->
    <div id="lobbyModal" class="modal-overlay">
        <div class="modal-box">
            <h2>CleverDados</h2>
            <p>Multijugador</p>

            <div id="sessionBanner" class="session-banner" style="display: none;">
                <p id="sessionBannerText" class="session-banner-text"></p>
            </div>

            <div id="urlDataDisplay" class="url-data-display" style="display: none; background: #2a2a2a; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--color-azul);">
                <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span>Nombre: <span id="urlPlayerName">---</span></span>
                    <span>Sala: <span id="urlRoomCode">---</span></span>
                </div>
            </div>

            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-primary" onclick="entrarSala()">Entrar</button>
                    <button id="reconnectBtn" class="modal-btn btn-primary" onclick="reconnectToSession()" disabled>Reconectar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- UNIRSE A SALA (respaldo - oculto) -->
    <div id="joinModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Unirse a Sala</h2>
            <p>Pide el código al creador de la sala</p>
            <div class="input-group">
                <label>Código de la Sala (4 letras/números):</label>
                <input type="text" id="roomCodeInput" placeholder="ABCD" maxlength="4" style="text-transform: uppercase;">
            </div>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="backToLobby()">Volver</button>
                    <button class="modal-btn btn-secondary" onclick="joinRoom()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CARGANDO -->
    <div id="loadingModal" class="modal-overlay">
        <div class="modal-box" style="background: transparent; border: none; box-shadow: none;">
            <h2 id="loadingText">Conectando...</h2>
        </div>
    </div>

    <!-- RECLAMO DE NOMBRE (RECONEXION DESDE OTRO DISPOSITIVO) -->
    <div id="claimModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Jugador existente</h3>
            <p id="claimText">Ya hay un jugador con este nombre en la sala.</p>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="declineClaim()">No, soy otro jugador</button>
                    <button class="modal-btn btn-primary" onclick="acceptClaim()">Sí, soy yo</button>
                </div>
            </div>
        </div>
    </div>

    <!-- REINICIAR -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="confirmTitle">Reiniciar tablero</h3>
            <p id="confirmText">Se borrarán todas tus marcas.</p>
            <div class="modal-buttons">
                <div class="row-btns">
                    <button class="modal-btn btn-outline" onclick="cerrarModal()">Cancelar</button>
                    <button class="modal-btn btn-danger" onclick="confirmarReinicio()">Reiniciar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ZOOM DE ÁREA -->
    <div id="zoomAreaModal" class="modal-overlay zoom-area-modal" style="display: none;">
        <div class="modal-box zoom-modal">
            <div class="zoom-header">
                <!-- Título eliminado -->
            </div>
            <div class="zoom-body">
                <div class="area-replica" id="zoomAreaContent"></div>
            </div>
        </div>
    </div>

    <!-- UI DEL JUEGO -->
    <header>
        <h1>CleverDados</h1>
        <div id="roomInfoDisplay" class="room-info" style="display: none;"></div>
    </header>

    <div class="app-container">
        <div class="board-container">
            <!-- TABLERO COMPLETO -->
            <div class="board" id="game-board">
                <!-- ÁREA GRIS (Fila 1) - SIN ZOOM -->
                <div class="area area-gris" id="area-gris">
                    <div id="area-gris-content"></div>
                </div>

                <!-- FILA 2: AMARILLA | AZUL -->
                <div class="area-row">
                    <!-- ÁREA AMARILLA -->
                    <div class="area area-amarilla half area-clickable" id="area-amarilla" data-area="amarilla" onclick="abrirZoomArea('amarilla')">
                        <div id="area-amarilla-content"></div>
                    </div>

                    <!-- ÁREA AZUL -->
                    <div class="area area-azul half area-clickable" id="area-azul" data-area="azul" onclick="abrirZoomArea('azul')">
                        <div id="area-azul-content"></div>
                    </div>
                </div>

                <!-- ÁREA VERDE (Fila 3) -->
                <div class="area area-verde area-clickable" id="area-verde" data-area="verde" onclick="abrirZoomArea('verde')">
                    <div id="area-verde-content"></div>
                </div>

                <!-- ÁREA NARANJA (Fila 4) -->
                <div class="area area-naranja area-clickable" id="area-naranja" data-area="naranja" onclick="abrirZoomArea('naranja')">
                    <div id="area-naranja-content"></div>
                </div>

                <!-- ÁREA MORADO (Fila 5) -->
                <div class="area area-morado area-clickable" id="area-morado" data-area="morado" onclick="abrirZoomArea('morado')">
                    <div id="area-morado-content"></div>
                </div>
            </div>
        </div>

        <div class="side-panel">
            <!-- TABLA DE POSICIONES -->
            <div class="leaderboard" id="leaderboardPanel">
                <h3>Posiciones</h3>
                <div id="playersList"></div>
                <div class="controls">
                    <button id="resetBtn" class="modal-btn btn-danger" onclick="mostrarModalReinicio()">Reiniciar Mi Tablero</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
    SCRIPTS - ORDEN DE CARGA CORRECTO
    ============================================================ -->
    
        <!-- 1. UTILIDADES -->
        <script src="js/numerico.js"></script>

        <!-- 2. DESHACER -->
        <script src="js/deshacer.js"></script>

        <!-- 3. ÁREAS -->
        <script src="js/areas/area-gris.js"></script>
        <script src="js/areas/area-amarilla.js"></script>
        <script src="js/areas/area-azul.js"></script>
        <script src="js/areas/area-verde.js"></script>
        <script src="js/areas/area-naranja.js"></script>
        <script src="js/areas/area-morado.js"></script>

        <!-- 4. SISTEMA DE LOBOS -->
        <script src="js/lobos.js"></script>

        <!-- 5. SISTEMA DE PUNTAJES -->
        <script src="js/puntajes.js"></script>

        <!-- 6. LEADERBOARD -->
        <script src="js/leaderboard.js"></script>

        <!-- 7. ZOOM -->
        <script src="js/zoom.js"></script>

        <!-- 8. SESION (NUEVO) -->
        <script src="sesion.js"></script>

        <!-- 9. MULTIJUGADOR -->
        <script src="multijugador.js"></script>

        <!-- 10. MAIN -->
        <script src="main.js"></script>
</body>
</html>

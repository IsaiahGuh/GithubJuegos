<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HotCarreras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================ -->
    <!-- CREAR PARTIDA -->
    <!-- ============================================ -->
    <div id="lobbyModal" class="modal-overlay">
        <div class="modal-box" id="lobbyModalBox">
            <!-- VISTA PRINCIPAL -->
            <div id="vistaPrincipal">
                <h2>HotCarreras</h2>
                <p>Crear nueva partida</p>
                <div class="modal-buttons">
                    <div class="row-btns">
                        <button class="modal-btn btn-secondary" onclick="window.toggleVistaJugadores()">Jugadores</button>
                        <button class="modal-btn btn-primary" onclick="window.iniciarPartida()">Entrar</button>
                    </div>
                </div>
            </div>

            <!-- VISTA EDICION DE JUGADORES -->
            <div id="vistaJugadores" style="display:none;">
                <h2>Jugadores</h2>
                <div id="listaJugadoresContainer" class="lista-jugadores">
                    <!-- Los inputs se generan dinamicamente -->
                </div>
                <div class="modal-buttons">
                    <button class="modal-btn btn-outline" onclick="window.agregarJugador()" id="btnAgregarJugador" style="width:100%;">
                        + Agregar Jugador
                    </button>
                    <button class="modal-btn btn-primary" onclick="window.toggleVistaJugadores()" style="margin-top:10px;">
                        Listo
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL SELECCION JUGADOR (para apuestas) -->
    <!-- ============================================ -->
    <div id="modalSeleccionJugador" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <h3>Selecciona un jugador</h3>
            <div id="listaJugadoresSeleccion" class="lista-jugadores"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL FINALIZACIÓN (PODIO) -->
    <!-- ============================================ -->
    <div id="modalFinalizacion" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="max-width: 480px;">
            <h3 style="margin-bottom: 16px;">Finalizar Partida</h3>
            <p style="margin-bottom: 12px; color: var(--text-muted);">Ingresa el orden de los colores:</p>
            
            <!-- PODIO: posiciones 1, 2, 3 -->
            <div id="podioContainer" style="display: flex; gap: 12px; justify-content: center; margin-bottom: 16px;"></div>
            
            <!-- Posición 4 (fuera del podio) -->
            <div id="pos4Container" style="margin-bottom: 20px;"></div>

            <!-- Toggle Sí/No -->
            <div style="margin: 16px 0;">
                <label style="display: block; margin-bottom: 6px; font-weight: bold;">¿Ganó el "Sí" o el "No"?</label>
                <div id="toggleSiNoContainer" style="display: flex; gap: 8px; justify-content: center;"></div>
            </div>

            <div class="modal-buttons">
                <button class="btn-control btn-final" onclick="window.calcularYFinalizar()">Finalizar</button>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- UI DEL JUEGO -->
    <!-- ============================================ -->
    <header>
        <h1>HotCarreras</h1>
    </header>

    <!-- ============================================ -->
    <!-- AREA DE APUESTAS -->
    <!-- ============================================ -->
    <div class="apuestas-area" id="apuestasArea">
        <h2 class="apuestas-titulo">Apuestas</h2>
    </div>

    <!-- BOTONES -->
    <div class="controles-juego">
        <button class="btn-control btn-historial" onclick="window.mostrarHistorial()">Historial</button>
        <button class="btn-control btn-carta" onclick="window.robarYMostrar()">Carta</button>
        <button class="btn-control btn-final" onclick="window.mostrarFinalizacion()">Final</button>
        <button class="btn-control btn-reiniciar" onclick="window.reiniciarPartida()">Reiniciar</button>
        <div class="info-mazo">
            <span>Restantes: <strong id="contadorCartasFooter">0</strong></span>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL HISTORIAL -->
    <!-- ============================================ -->
    <div id="modalHistorial" class="modal">
        <div class="modal-contenido historial-contenido">
            <h3>Cartas Robadas</h3>
            <div id="historialLista" class="historial-lista"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL ZOOM (también se usa para mostrar apuestas del jugador) -->
    <!-- ============================================ -->
    <div id="modalZoom" class="modal zoom-modal">
        <div class="zoom-contenido">
            <button id="cerrarZoomBtn" class="cerrar-zoom-btn">X</button>
        </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="leaderboard" id="leaderboardPanel" style="display: none;">
        <div class="leaderboard-header" onclick="window.toggleLeaderboard()">
            <h3>Jugadores</h3>
            <span id="toggleIcon">▲</span>
        </div>
        <div id="leaderboardContent" class="leaderboard-content">
            <div id="playersList"></div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script type="module" src="main.js"></script>
</body>
</html>
